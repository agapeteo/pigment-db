name: Recovery

on:
  pull_request:
  push:

jobs:
  recovery:
    name: Recovery (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Complete regression suite
        if: runner.os == 'Linux'
        run: cargo test --all-targets --all-features -- --test-threads=1
      - name: V1 codec, fresh publication, repair, and options
        run: cargo test wal::truncation_tests -- --test-threads=1
      - name: Public truncation and timestamp matrices
        run: cargo test --test truncated_wal -- --test-threads=1
      - name: Public recovery scenarios
        if: runner.os != 'Windows'
        run: cargo test --test recovery -- --test-threads=1
      - name: Public recovery scenarios (Windows diagnostics)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = & cargo test --test recovery -- --test-threads=1 --nocapture 2>&1
          $exit_code = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          if ($exit_code -ne 0) {
            $details = ($output | Select-Object -Last 100) -join "`n"
            $details = $details.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=Windows recovery tests::$details"
            exit $exit_code
          }
      - name: Publication fault checkpoints
        run: cargo test wal::recovery::tests -- --test-threads=1
      - name: Compute persistence scenarios
        run: cargo test --test compute_persistence -- --test-threads=1
      - name: Compute WAL fault checkpoints
        run: cargo test wal::tests::compute_batch -- --test-threads=1
      - name: Fast mutation ordering contract
        run: cargo test --test mutation_ordering -- --test-threads=1
      - name: Mutation WAL rejection checkpoints
        run: cargo test wal::ordering_tests -- --test-threads=1
      - name: Dedicated issue regression targets
        run: |
          cargo test --test async_compute_conflicts -- --test-threads=1
          cargo test --test ci_workflow -- --test-threads=1
          cargo test --test i128_key -- --test-threads=1
          cargo test --test map_pop_return_values -- --test-threads=1
          cargo test --test numeric_increment_overflow -- --test-threads=1
          cargo test --test ordered_map_append -- --test-threads=1
          cargo test --test v2_wal_segments -- --test-threads=1
      - name: Physical durability capability and publication matrix
        run: cargo test --test durable_write_policy public_ -- --test-threads=1
      - name: Windows physical durability and buffered compatibility matrix
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = & cargo test --test windows_physical_durability -- --test-threads=1 --nocapture 2>&1
          $exit_code = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          if ($exit_code -ne 0) {
            $details = ($output | Select-Object -Last 100) -join "`n"
            $details = $details.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=Windows physical durability tests::$details"
            exit $exit_code
          }
      - name: Windows native boundary and physical fault models
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          $output = & cargo test durability::windows::tests -- --test-threads=1 2>&1
          $exit_code = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          if ($exit_code -ne 0) {
            $details = ($output | Select-Object -Last 100) -join "`n"
            $details = $details.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=Windows native durability boundary::$details"
            $failed = $true
          }
          $output = & cargo test wal::durability_tests:: -- --test-threads=1 2>&1
          $exit_code = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          if ($exit_code -ne 0) {
            $details = ($output | Select-Object -Last 100) -join "`n"
            $details = $details.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=Windows WAL durability fault models::$details"
            $failed = $true
          }
          $output = & cargo test compaction::recovery_tests:: -- --test-threads=1 2>&1
          $exit_code = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          if ($exit_code -ne 0) {
            $details = ($output | Select-Object -Last 100) -join "`n"
            $details = $details.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=Windows compaction recovery fault models::$details"
            $failed = $true
          }
          if ($failed) { exit 1 }
      - name: Set compute publication faults
        run: |
          cargo test key_set_store::tests:: -- --test-threads=1
      - name: Map compute publication faults
        run: |
          cargo test key_map_store::tests:: -- --test-threads=1
      - name: Offline migration engine
        run: |
          cargo test migration::tests:: -- --test-threads=1
      - name: Migration command-line contract
        run: cargo test --test migration_cli -- --test-threads=1
